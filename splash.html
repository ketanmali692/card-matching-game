<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #splash {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, #2d1b4e 0%, #0a0514 50%, #050208 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; z-index: 9999;
        }
        .splash-title {
            font-size: clamp(24px, 7vw, 42px); font-weight: 900; color: #a855f7;
            text-align: center; letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.8);
            margin-bottom: 10px; animation: splashPulse 2s infinite;
        }
        @keyframes splashPulse {
            0%, 100% { text-shadow: 0 0 30px rgba(168, 85, 247, 0.8); }
            50% { text-shadow: 0 0 50px rgba(168, 85, 247, 1); }
        }
        .splash-sub { font-size: clamp(12px, 3vw, 16px); color: #4ade80; font-style: italic; margin-bottom: 50px; letter-spacing: 1px; }
        .progress-bar { width: 400px; max-width: 80vw; height: 20px; background: #1a0d2e; border: 2px solid #a855f7; border-radius: 15px; padding: 3px; position: relative; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #a855f7 0%, #4ade80 100%); border-radius: 12px; transition: width 0.1s linear; }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-title">LOADING...</div>
    <div class="splash-sub">★ 3D MEMORY CHALLENGE ★</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<script>
    // 5 second timer
    var progress = 0;
    var fill = document.getElementById('progressFill');
    var interval = setInterval(function() {
        progress += 2;
        if (progress > 100) progress = 100;
        fill.style.width = progress + '%';
        if (progress >= 100) {
            clearInterval(interval);
            setTimeout(function() {
                window.location.href = 'index.html';
            }, 500);
        }
    }, 100);
</script>
</body>
</html>
